<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Aether Loop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="frame">
      <canvas id="game" width="960" height="720"></canvas>

      <header class="hud">
        <div class="stat">
          <span class="label">Score</span>
          <span id="score">0</span>
        </div>
        <div class="stat center">
          <span class="label">Combo</span>
          <span id="combo">x1</span>
        </div>
        <div class="stat right">
          <span class="label">Best</span>
          <span id="best">0</span>
        </div>
      </header>

      <div id="overlay" class="overlay">
        <p class="kicker">orbital arcade</p>
        <h1>Aether Loop</h1>
        <p class="lede">
          Ride the rings. Collect prism shards. Slip past the debris field.
        </p>
        <ul class="controls">
          <li><kbd>W</kbd> <kbd>S</kbd> or <kbd>↑</kbd> <kbd>↓</kbd> change ring</li>
          <li><kbd>Space</kbd> or tap reverse orbit</li>
        </ul>
        <button id="start" type="button">Enter orbit</button>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
